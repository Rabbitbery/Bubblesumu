<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuMu · Bubble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#cfeaff; --sky2:#ecdcff; --sky3:#ffdcef; --ink:#3b2a5c; --ink2:#6a548f;
  --glass:rgba(255,255,255,.55); --glassLine:rgba(255,255,255,.8); --veil:rgba(52,30,92,.45);
  --head:'Pacifico','Segoe Script','Comic Sans MS',cursive;
  --body:'Hind Siliguri','Noto Sans Bengali','Nirmala UI',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky1:#181540;--sky2:#2c1a4d;--sky3:#54205a;--ink:#fff0fb;--ink2:#d8c2ee;--glass:rgba(255,255,255,.12);--glassLine:rgba(255,255,255,.28);--veil:rgba(10,4,30,.62)}
}
:root[data-theme="dark"]{--sky1:#181540;--sky2:#2c1a4d;--sky3:#54205a;--ink:#fff0fb;--ink2:#d8c2ee;--glass:rgba(255,255,255,.12);--glassLine:rgba(255,255,255,.28);--veil:rgba(10,4,30,.62)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;position:relative;color:var(--ink);font-family:var(--body);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 52%,var(--sky3) 100%) var(--sky2)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky1)}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:12;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
#top h1{font-family:var(--head);font-weight:400;font-size:26px;line-height:1.1;color:var(--ink);text-shadow:0 2px 0 var(--glassLine)}
#hint{font-size:14px;color:var(--ink2);margin-top:3px;font-weight:600}
#tools{display:flex;gap:8px;align-items:center;pointer-events:auto}
.pill{font:700 14px/1 var(--body);color:var(--ink);background:var(--glass);border:1px solid var(--glassLine);border-radius:999px;padding:9px 13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button.pill{cursor:pointer}
button:focus-visible,.bub:focus-visible{outline:3px solid #7a5cff;outline-offset:3px}

#field{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:2}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* soap bubble */
.bub{position:absolute;left:0;top:0;border-radius:50%;will-change:transform;cursor:pointer;touch-action:manipulation;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 0 16px rgba(255,255,255,.55),inset 9px -7px 22px rgba(255,120,210,.32),inset -9px 9px 22px rgba(100,210,255,.36),0 10px 26px rgba(120,110,255,.25)}
.bub .gl{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
   radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0 4%,rgba(255,255,255,0) 18%),
   radial-gradient(ellipse 20% 8% at 68% 82%,rgba(255,255,255,.6),rgba(255,255,255,0)),
   radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 55%,rgba(150,200,255,.2) 72%,rgba(255,160,225,.34) 88%,rgba(150,255,225,.46) 100%)}
.bub::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(rgba(255,120,200,0),rgba(255,170,120,.3),rgba(255,255,140,0),rgba(120,255,200,.32),rgba(120,170,255,0),rgba(220,140,255,.36),rgba(255,120,200,0));
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 80%);mask:radial-gradient(circle,transparent 58%,#000 80%);
  animation:spin 11s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bub img{position:absolute;inset:4%;width:92%;height:92%;border-radius:50%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.bub.small{cursor:pointer;opacity:.85}
.bub.gold{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),inset 0 0 28px rgba(255,255,255,.7),inset 12px -10px 34px rgba(255,100,190,.5),inset -12px 12px 34px rgba(255,210,90,.5),0 0 60px rgba(255,150,220,.55)}
.bub.gold .star{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* photo card */
#card{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#card[hidden]{display:none}
#veil{position:absolute;inset:0;background:var(--veil);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#pw{position:relative;left:auto;top:auto;width:var(--ps,300px);height:var(--ps,300px);cursor:default;z-index:1}
#pw img{inset:5%;width:90%;height:90%}
#pcap{position:relative;z-index:1;font:700 16px/1.3 var(--body);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4);text-align:center;min-height:42px}
#pcap small{display:block;font-weight:600;font-size:14px;opacity:.85}

/* collection strip */
#strip{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;justify-content:center;min-height:calc(env(safe-area-inset-bottom,0px) + 78px)}
#slots{display:flex;gap:6px;padding:8px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glassLine);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.slot{width:34px;height:34px;border-radius:50%;border:2px dashed var(--glassLine);background-size:cover;background-position:center;flex:none}
.slot.on{border:2px solid #fff;box-shadow:0 0 0 1px rgba(160,120,255,.5),0 3px 10px rgba(120,90,200,.35);animation:slotpop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes slotpop{from{transform:scale(.2)}to{transform:scale(1)}}
#again{display:none;font:700 17px/1 var(--body);color:#fff;border:0;border-radius:999px;padding:15px 26px;cursor:pointer;background:linear-gradient(135deg,#ff7eb6,#9a6bff);box-shadow:0 10px 26px rgba(150,90,255,.4)}
#again:active{transform:scale(.96)}
body.final #slots{display:none}
body.final #again{display:block}

/* name */
#name{position:absolute;left:0;right:0;top:0;text-align:center;pointer-events:none;z-index:3;display:none}
body.final #name{display:block}
#name .row{font-family:var(--head);font-size:clamp(72px,26vw,132px);line-height:1.15;display:flex;justify-content:center;gap:.02em}
#name .row span{display:inline-block;opacity:0;transform:scale(.2) translateY(30px);animation:letter .9s cubic-bezier(.2,1.6,.4,1) forwards,bobL 3.4s ease-in-out infinite;-webkit-text-stroke:2px rgba(255,255,255,.9);paint-order:stroke fill;color:transparent;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 rgba(110,60,170,.28))}
#name .row span:nth-child(1){background-image:linear-gradient(180deg,#ff9cc8,#ff5fa2);animation-delay:.1s,1s}
#name .row span:nth-child(2){background-image:linear-gradient(180deg,#c9a9ff,#8f66ff);animation-delay:.3s,1.3s}
#name .row span:nth-child(3){background-image:linear-gradient(180deg,#8fdcff,#3fb2ff);animation-delay:.5s,1.6s}
#name .row span:nth-child(4){background-image:linear-gradient(180deg,#ffd27a,#ff9f3f);animation-delay:.7s,1.9s}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes bobL{0%,100%{translate:0 0}50%{translate:0 -8px}}
#name p{font-size:15px;font-weight:600;color:var(--ink2);margin-top:2px;opacity:0;animation:fade 1s ease 1.8s forwards}
@keyframes fade{to{opacity:1}}

@media (prefers-reduced-motion:reduce){.bub::after{animation:none}#name .row span{animation:letter .01s forwards}}
@media (max-height:560px){#top h1{font-size:22px}}
</style>

<style id="polished-ui">
:root{
 --sky1:#100d20;--sky2:#21152f;--sky3:#3a1b43;
 --ink:#fff8ff;--ink2:#d9c8e8;
 --glass:rgba(255,255,255,.085);--glassLine:rgba(255,255,255,.16);--veil:rgba(9,5,18,.82);
}
body{background:radial-gradient(ellipse at 50% -12%,#493064 0%,#21172f 40%,#100d1d 78%,#0a0912 100%);color:var(--ink)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;background-image:radial-gradient(#fff 0.65px,transparent .65px);background-size:31px 31px;mask-image:linear-gradient(to bottom,black,transparent 82%)}
#top{align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0;gap:12px}
#top h1{font-family:var(--body);font-size:clamp(23px,6vw,29px);font-weight:700;letter-spacing:-.8px;color:#fff; text-shadow:0 2px 18px #e879cf35}
.brand-dot{color:#ff9dd9;font-size:.8em;margin-left:2px}
#hint{font-size:13px;letter-spacing:.1px;color:#c8b5db;margin-top:5px;font-weight:500}
#tools{gap:9px}
.pill{font-size:13px;color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);box-shadow:0 5px 18px #00000018;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#count{padding:10px 13px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
#snd{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:16px}
#field{top:calc(env(safe-area-inset-top,0px) + 86px);bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
.bub{box-shadow:inset 0 0 0 1px rgba(255,255,255,.76),inset 0 0 18px rgba(255,255,255,.34),inset 9px -7px 22px rgba(255,120,210,.22),inset -9px 9px 22px rgba(100,210,255,.25),0 12px 32px rgba(0,0,0,.2),0 0 24px rgba(184,128,255,.12)}
.bub::after{opacity:.85}
#strip{min-height:calc(env(safe-area-inset-bottom,0px) + 78px);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
#slots{gap:7px;padding:9px 12px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);box-shadow:0 10px 34px #0000001a;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.slot{width:31px;height:31px;border:1.5px dashed rgba(255,255,255,.3);background-color:rgba(255,255,255,.035)}
.slot.on{border:2px solid #fff;box-shadow:0 0 0 2px #d88bff38,0 0 18px #ed8ad966}
#again{font:700 15px/1 var(--body);color:#20102c;border:0;border-radius:999px;padding:15px 24px;background:linear-gradient(115deg,#ffc2e6,#c5b2ff 55%,#a9e7ff);box-shadow:0 8px 30px #d48dff30}
#card{gap:17px;padding:24px}
#veil{background:rgba(9,5,18,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#pw{filter:drop-shadow(0 18px 50px rgba(0,0,0,.42))}
#pcap{font-size:14px;color:#fff;letter-spacing:.1px}
#pcap small{font-size:12px;color:#dfd1eb;margin-top:4px}
#name .row{font-family:var(--body);font-weight:800;font-size:clamp(68px,23vw,118px);letter-spacing:-.06em}
#name .row span{-webkit-text-stroke:1.5px rgba(255,255,255,.72);filter:drop-shadow(0 8px 22px rgba(180,100,255,.24))}
#name p{font-size:13px;color:#d8c5e9;letter-spacing:.2px}
@media(max-width:390px){#top{padding-left:15px;padding-right:15px}#top h1{font-size:23px}#hint{font-size:12px}.slot{width:27px;height:27px}#slots{gap:5px;padding:8px 9px}}
@media(max-height:560px){#top{padding-top:calc(env(safe-area-inset-top,0px) + 9px)}#field{top:calc(env(safe-area-inset-top,0px) + 60px);bottom:calc(env(safe-area-inset-bottom,0px) + 68px)}#strip{min-height:calc(env(safe-area-inset-bottom,0px) + 58px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 7px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<header id="top">
  <div><h1>SuMu <span class="brand-dot">✦</span></h1><div id="hint">সবগুলো বাবল ফাটাও</div></div>
  <div id="tools"><span class="pill" id="count">0 / 8</span><button class="pill" id="snd" type="button" aria-label="Sound on or off">🔊</button></div>
</header>

<div id="field" role="group" aria-label="Bubbles">
  <div id="name"><div class="row" aria-label="SuMu"><span>S</span><span>u</span><span>M</span><span>u</span></div><p>ছবিগুলো আবার দেখতে ট্যাপ করো</p></div>
</div>

<div id="card" hidden>
  <div id="veil"></div>
  <div id="pw" class="bub"><img id="pimg" alt="Bubble theke ber howa photo"><span class="gl"></span></div>
  <div id="pcap"></div>
</div>

measure(); addEventListener('resize',measure);

/* ---------- sound ---------- */
var actx=null, muted=false;
function ac(){
  if(!actx){var A=window.AudioContext||window.webkitAudioContext; if(A){try{actx=new A()}catch(e){}}}
  if(actx&&actx.state==='suspended'){try{actx.resume()}catch(e){}}
  return actx;
}
function popSound(big){
  if(muted||!ac())return;
  try{
    var t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(big?620:1250+Math.random()*300,t);o.frequency.exponentialRampToValueAtTime(big?140:260,t+.1);
    g.gain.setValueAtTime(big?.3:.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.15);
    var n=actx.createBuffer(1,actx.sampleRate*.05,actx.sampleRate),d=n.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    var s=actx.createBufferSource(),gg=actx.createGain(),f=actx.createBiquadFilter();
    f.type='highpass';f.frequency.value=2200;s.buffer=n;gg.gain.value=big?.25:.14;s.connect(f);f.connect(gg);gg.connect(actx.destination);s.start(t);
  }catch(e){}
}
function chime(){
  if(muted||!ac())return;
  try{
    [784,988,1175,1568,1976].forEach(function(f,i){
      var t=actx.currentTime+.05+i*.12,o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0005,t+1.1);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+1.2);
    });
  }catch(e){}
}
sndBtn.addEventListener('click',function(){muted=!muted;sndBtn.textContent=muted?'🔇':'🔊';ac()});
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- particles ---------- */
var P=[];
function hue(){return (Math.random()*360)|0}
function burst(x,y,r,big){
  P.push({t:'ring',x:x,y:y,r:r*.9,max:big?46:26,life:0,w:big?4:2.5});
  var n=big?34:16;
  for(var i=0;i<n;i++){var a=Math.random()*6.283,sp=(big?2.5:1.6)+Math.random()*(big?5:3);
    P.push({t:'drop',x:x+Math.cos(a)*r*.8,y:y+Math.sin(a)*r*.8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.6,r:(big?3:2)+Math.random()*3,h:hue(),life:0,max:36+Math.random()*28})}
  for(var j=0;j<(big?10:4);j++)P.push({t:'spark',x:x,y:y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-1,r:4+Math.random()*6,h:hue(),life:0,max:50+Math.random()*30,rot:Math.random()*6});
}
function heart(x,y){P.push({t:'heart',x:x,y:y,vx:(Math.random()-.5)*.6,vy:-.7-Math.random()*1.2,r:6+Math.random()*9,life:0,max:170+Math.random()*100,col:['#ff7eb6','#ffa6cd','#ff5fa2','#ffc2dc'][(Math.random()*4)|0],ph:Math.random()*6})}
function hp(x,y,r){c2.beginPath();c2.moveTo(x,y+r*.9);c2.bezierCurveTo(x-r*1.6,y-r*.1,x-r*.7,y-r*1.2,x,y-r*.35);c2.bezierCurveTo(x+r*.7,y-r*1.2,x+r*1.6,y-r*.1,x,y+r*.9);c2.closePath()}
function drawFx(){
  c2.clearRect(0,0,VW,VH);
  for(var i=P.length-1;i>=0;i--){
    var p=P[i];p.life++;var k=p.life/p.max;
    if(k>=1){P.splice(i,1);continue}
    if(p.t==='ring'){p.r+=(1-k)*4.5+1;c2.globalAlpha=(1-k)*.9;c2.strokeStyle='hsl('+((p.life*9)%360)+',95%,78%)';c2.lineWidth=p.w*(1-k)+.5;c2.beginPath();c2.arc(p.x,p.y,p.r,0,6.283);c2.stroke()}
    else if(p.t==='drop'){p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.985;c2.globalAlpha=1-k;c2.fillStyle='hsl('+p.h+',95%,78%)';c2.beginPath();c2.arc(p.x,p.y,p.r*(1-k*.5),0,6.283);c2.fill();c2.fillStyle='rgba(255,255,255,.8)';c2.beginPath();c2.arc(p.x-p.r*.3,p.y-p.r*.3,p.r*.28,0,6.283);c2.fill()}
    else if(p.t==='spark'){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.rot+=.08;c2.globalAlpha=Math.sin(k*3.14);c2.fillStyle='hsl('+p.h+',100%,82%)';var r=p.r;c2.save();c2.translate(p.x,p.y);c2.rotate(p.rot);c2.beginPath();c2.moveTo(0,-r);c2.quadraticCurveTo(0,0,r,0);c2.quadraticCurveTo(0,0,0,r);c2.quadraticCurveTo(0,0,-r,0);c2.quadraticCurveTo(0,0,0,-r);c2.fill();c2.restore()}
    else if(p.t==='heart'){p.x+=p.vx+Math.sin((p.life+p.ph*30)/22)*.5;p.y+=p.vy;c2.globalAlpha=Math.min(1,(1-k)*1.6);c2.fillStyle=p.col;hp(p.x,p.y,p.r);c2.fill()}
  }
  c2.globalAlpha=1;
}

/* ---------- bubbles ---------- */
var bubs=[], smalls=[], lastT=0;
function mk(size,cls){
  var el=document.createElement('div');
  el.className='bub '+(cls||'');
  el.style.width=el.style.height=size+'px';
  el.setAttribute('role','button');el.tabIndex=0;
  var gl=document.createElement('span');gl.className='gl';el.appendChild(gl);
  field.appendChild(el);
  return el;
}
function anchors(n,top,bottom){
  var cols=W<H?3:4, rows=Math.ceil(n/cols), cells=[];
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)cells.push([c,r]);
  cells.sort(function(){return Math.random()-.5});
  cells=cells.slice(0,n);
  var cw=1/cols, ch=(bottom-top)/rows;
  return {list:cells.map(function(p){return {fx:(p[0]+.5)*cw+(Math.random()-.5)*cw*.28, fy:top+(p[1]+.5)*ch+(Math.random()-.5)*ch*.28}}), size:Math.max(70,Math.min(118,Math.min(W*cw,H*ch)*.66))};
}
function addMover(el,fxp,fyp,size,delay){
  var b={el:el,fx:fxp,fy:fyp,s:size,ph:Math.random()*6.28,ph2:Math.random()*6.28,fxs:.5+Math.random()*.5,fys:.6+Math.random()*.6,
         ax:REDUCE?2:8+Math.random()*10,ay:REDUCE?2:10+Math.random()*12,born:performance.now()+(delay||0)};
  bubs.push(b);return b;
}
function spawnPhotoBubbles(){
  var a=anchors(N,0.02,0.98);
  for(var i=0;i<N;i++){
    var el=mk(a.size,'');el.setAttribute('aria-label','Bubble '+(i+1)+', phutao');
    var b=addMover(el,a.list[i].fx,a.list[i].fy,a.size,i*140);b.idx=i;b.kind='photo';
    wire(b);
  }
}
function spawnSmalls(){
  for(var i=0;i<(REDUCE?4:12);i++){
    var s=12+Math.random()*24, el=mk(s,'small');el.setAttribute('aria-label','Chhoto bubble');el.tabIndex=-1;
    var o={el:el,s:s,x:Math.random(),sp:16+Math.random()*30,off:Math.random()*2000,sw:6+Math.random()*10,ph:Math.random()*6};
    smalls.push(o);
    (function(o){el.addEventListener('pointerdown',function(e){e.preventDefault();var r=o.el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,r.width/2,false);popSound(false);o.off=-1;o.reset=true})})(o);
  }
}
function wire(b){
  var h=function(e){if(e.type==='keydown'&&e.key!==' '&&e.key!=='Enter')return;e.preventDefault();popBubble(b)};
  b.el.addEventListener('pointerdown',h);b.el.addEventListener('keydown',h);
}

var state='play', collected=0, openMode='collect', openB=null, canClose=false;
function popBubble(b){
  if(b.popped)return;
  if(b.kind==='gal'){openGallery(b);return}
  b.popped=true;
  var r=b.el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, big=b.kind==='gold';
  burst(cx,cy,r.width/2,big);popSound(big);buzz(big?40:18);
  b.el.remove();bubs.splice(bubs.indexOf(b),1);
  if(b.kind==='photo'){setTimeout(function(){openCard(b.idx,{left:r.left,top:r.top,width:r.width,height:r.height},'collect')},160)}
  else if(b.kind==='gold'){revealName()}
}

/* ---------- card ---------- */
function rectOf(e){var r=e.getBoundingClientRect();return {left:r.left,top:r.top,width:r.width,height:r.height}}
function openCard(idx,from,mode,b){
  openMode=mode;openB=b||null;canClose=false;
  pimg.src=PHOTOS[idx];
  pcap.innerHTML=mode==='collect'?((collected+1)+' / '+N+'<small>Tap kore rakho 💖</small>'):'<small>Tap kore bondho koro</small>';
  card.hidden=false;
  veil.animate([{opacity:0},{opacity:1}],{duration:300,fill:'both'});
  var to=rectOf(pw), sx=from.width/to.width, dx=(from.left+from.width/2)-(to.left+to.width/2), dy=(from.top+from.height/2)-(to.top+to.height/2);
  pw.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+')',opacity:.3},{transform:'none',opacity:1}],{duration:REDUCE?1:720,easing:'cubic-bezier(.2,1.35,.35,1)',fill:'both'});
  pcap.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:500,delay:350,fill:'both'});
  for(var i=0;i<(mode==='collect'?14:0);i++)setTimeout(function(){var r=rectOf(pw);heart(r.left+Math.random()*r.width,r.top+r.height*(.5+Math.random()*.5))},200+i*70);
  setTimeout(function(){canClose=true},520);
}
function closeCard(){
  if(!canClose||card.hidden)return;canClose=false;
  var from=rectOf(pw), tgt;
  if(openMode==='collect'){tgt=rectOf(slotsEl.children[collected])}
  else if(openB&&openB.el.isConnected){tgt=rectOf(openB.el)}
  else tgt={left:from.left+from.width/2,top:from.top+from.height/2,width:10,height:10};
  var sx=tgt.width/from.width, dx=(tgt.left+tgt.width/2)-(from.left+from.width/2), dy=(tgt.top+tgt.height/2)-(from.top+from.height/2);
  veil.animate([{opacity:1},{opacity:0}],{duration:420,fill:'both'});
  pcap.animate([{opacity:1},{opacity:0}],{duration:200,fill:'both'});
  var a=pw.animate([{transform:'none',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+')',opacity:.9}],{duration:REDUCE?1:480,easing:'cubic-bezier(.5,0,.8,.4)',fill:'both'});
  a.onfinish=function(){
    card.hidden=true;
    if(openMode==='collect'){
      var s=slotsEl.children[collected];s.style.backgroundImage='url('+PHOTOS[openIdxForSlot()]+')';s.classList.add('on');
      collected++;countEl.textContent=collected+' / '+N;
      if(collected>=N){hintEl.textContent='শেষ বাবলটা ফাটাও ✨';setTimeout(spawnGold,700)}
    }
  };
}
var lastIdx=0;
function openIdxForSlot(){return lastIdx}
card.addEventListener('pointerdown',function(e){e.preventDefault();closeCard()});
addEventListener('keydown',function(e){if(!card.hidden&&(e.key==='Escape'||e.key==='Enter'||e.key===' ')){e.preventDefault();closeCard()}});
var _open=openCard;
openCard=function(idx,from,mode,b){lastIdx=idx;_open(idx,from,mode,b)};

/* ---------- finale ---------- */
function spawnGold(){
  state='gold';
  var s=Math.min(W*.64,H*.42,260), el=mk(s,'gold');el.setAttribute('aria-label','Shesh bubble, phutao');
  var st=document.createElement('span');st.className='star';st.textContent='✨';el.appendChild(st);
  var b=addMover(el,.5,.5,s,0);b.kind='gold';b.ax=REDUCE?2:10;b.ay=REDUCE?2:14;wire(b);
}
function revealName(){
  state='final';chime();
  document.body.classList.add('final');hintEl.textContent='সব বাবল ফেটেছে 💖';
  countEl.style.display='none';
  nameEl.style.display='block';
  // restart letter animation
  var spans=nameEl.querySelectorAll('.row span');spans.forEach(function(s){s.style.animation='none';void s.offsetWidth;s.style.animation=''});
  var p=nameEl.querySelector('p');p.style.animation='none';void p.offsetWidth;p.style.animation='';
  var nh=nameEl.getBoundingClientRect().height||180;
  var top=Math.min(.5,(nh+10)/H);
  var a=anchors(N,top,.98), size=Math.max(70,Math.min(104,a.size*.9));
  for(var i=0;i<N;i++){
    (function(i){
      var el=mk(size,'gal');var im=document.createElement('img');im.src=PHOTOS[i];im.alt='Photo '+(i+1);el.insertBefore(im,el.firstChild);el.setAttribute('aria-label','Photo '+(i+1)+', abar dekho');
      var b=addMover(el,a.list[i].fx,a.list[i].fy,size,500+i*160);b.kind='gal';b.idx=i;wire(b);
    })(i);
  }
  for(var j=0;j<30;j++)setTimeout(function(){heart(Math.random()*VW,VH*(.6+Math.random()*.4))},j*140);
  var loop=setInterval(function(){if(state!=='final'){clearInterval(loop);return}heart(Math.random()*VW,VH+10)},600);
}
function openGallery(b){openCard(b.idx,rectOf(b.el),'gallery',b)}

againBtn.addEventListener('click',function(){
  bubs.forEach(function(b){b.el.remove()});bubs.length=0;
  nameEl.style.display='none';document.body.classList.remove('final');
  collected=0;state='play';countEl.style.display='';countEl.textContent='0 / '+N;hintEl.textContent='সবগুলো বাবল ফাটাও';
  Array.prototype.forEach.call(slotsEl.children,function(s){s.classList.remove('on');s.style.backgroundImage=''});
  spawnPhotoBubbles();
});

/* ---------- init ---------- */
for(var i=0;i<N;i++){var s=document.createElement('div');s.className='slot';slotsEl.appendChild(s)}
countEl.textContent='0 / '+N;
spawnSmalls();spawnPhotoBubbles();
PHOTOS.forEach(function(u){var im=new Image();im.src=u});

function frame(now){
  requestAnimationFrame(frame);
  var t=now/1000;
  for(var i=0;i<bubs.length;i++){
    var b=bubs[i], age=Math.max(0,Math.min(1,(now-b.born)/1500)), e=1-Math.pow(1-age,3);
    var x=b.fx*W+Math.sin(t*b.fxs+b.ph)*b.ax-b.s/2;
    var y=b.fy*H+Math.sin(t*b.fys+b.ph2)*b.ay-b.s/2+(1-e)*H*.8;
    var sc=(.5+.5*e)*(1+.025*Math.sin(t*2+b.ph));
    b.el.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0) scale('+sc.toFixed(3)+')';
    b.el.style.opacity=e.toFixed(2);
  }
  for(var k=0;k<smalls.length;k++){
    var o=smalls[k];
    if(o.reset){o.off=0;o.born=now;o.reset=false;o.x=Math.random()}
    var dist=((t*o.sp+o.off)%(H+o.s*2));
    var y2=H+o.s-dist, x2=o.x*W+Math.sin(t*.8+o.ph)*o.sw-o.s/2;
    o.el.style.transform='translate3d('+x2.toFixed(1)+'px,'+y2.toFixed(1)+'px,0)';
  }
  drawFx();
}
requestAnimationFrame(frame);
})();
</script>
